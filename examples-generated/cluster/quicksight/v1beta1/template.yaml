apiVersion: quicksight.aws.upbound.io/v1beta1
kind: Template
metadata:
  annotations:
    meta.upbound.io/example-id: quicksight/v1beta1/template
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    name: example-name
    region: us-west-1
    sourceEntity:
      sourceTemplate:
        arnSelector:
          matchLabels:
            testing.upbound.io/example-name: source
    templateId: example-id
    versionDescription: version
