apiVersion: quicksight.aws.upbound.io/v1beta1
kind: TemplateAlias
metadata:
  annotations:
    meta.upbound.io/example-id: quicksight/v1beta1/templatealias
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    region: us-west-1
    templateIdSelector:
      matchLabels:
        testing.upbound.io/example-name: test
    templateVersionNumberSelector:
      matchLabels:
        testing.upbound.io/example-name: test
