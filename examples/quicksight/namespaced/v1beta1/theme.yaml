apiVersion: quicksight.aws.m.upbound.io/v1beta1
kind: Theme
metadata:
  annotations:
    meta.upbound.io/example-id: quicksight/v1beta1/theme
  labels:
    testing.upbound.io/example-name: example
  name: example-theme
  namespace: upbound-system
spec:
  forProvider:
    awsAccountId: "${data.aws_account_id}"
    themeId: example-theme-id
    name: example-theme
    baseThemeId: MIDNIGHT
    configuration:
      dataColorPalette:
        colors:
        - "#FFFFFF"
        - "#111111"
        - "#222222"
        - "#333333"
        - "#444444"
        - "#555555"
        - "#666666"
        - "#777777"
        - "#888888"
        - "#999999"
        emptyFillColor: "#FFFFFF"
        minMaxGradient:
        - "#FFFFFF"
        - "#111111"
    region: us-east-1
