apiVersion: quicksight.aws.upbound.io/v1beta1
kind: RoleMembership
metadata:
  annotations:
    meta.upbound.io/example-id: quicksight/v1beta1/rolemembership
  labels:
    testing.upbound.io/example-name: example
  name: example-group
spec:
  forProvider:
    awsAccountId: "${data.aws_account_id}"
    namespace: default
    memberName: example-group
    role: ADMIN_PRO
    region: us-east-1
---
apiVersion: quicksight.aws.upbound.io/v1beta1
kind: Group
metadata:
  annotations:
    meta.upbound.io/example-id: quicksight/v1beta1/groupmembership
  labels:
    testing.upbound.io/example-name: example
  name: example-group
spec:
  forProvider:
    awsAccountId: "${data.aws_account_id}"
    groupName: uptest-example
    namespace: default
    region: us-east-1
---